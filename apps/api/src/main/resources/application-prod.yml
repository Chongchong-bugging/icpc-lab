spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/icpc_lab}
    username: ${DB_USERNAME:icpc}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  version: ${APP_VERSION:0.1.0}