server:
  port: 8080
  shutdown: graceful

spring:
  application:
    name: icpc-lab-api
  datasource:
    url: jdbc:h2:mem:icpc;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    # 公共迁移与厂商专用迁移分开；避免递归扫描到另一厂商目录。
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  version: 0.1.0
  security:
    # 仅本地开发默认值；生产必须设置 APP_JWT_SECRET（application-prod.yml 无默认值）。
    jwt-secret: ${APP_JWT_SECRET:dev-only-jwt-secret-change-me-0123456789abcdef}
    issuer: icpc-lab
    access-ttl: 15m
    refresh-ttl: 7d
    refresh-cookie-name: icpc_refresh
    cookie-secure: false
    cookie-same-site: Lax
    max-failed-attempts: 5
    lock-duration: 15m
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:admin}
    # 本地开发回退值；生产 profile 无默认值，缺失即启动失败（种子规范 §3）。
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:DevOnly!2026}
  seed:
    demo: false
  file:
    storage-dir: ${APP_FILE_STORAGE_DIR:./.data/files}
    max-size-bytes: 5242880