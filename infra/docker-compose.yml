services:
  postgres:
    image: postgres:16-alpine
    container_name: icpc-lab-postgres
    environment:
      POSTGRES_DB: icpc_lab
      POSTGRES_USER: icpc
      POSTGRES_PASSWORD: icpc_dev_only
    ports:
      - "5432:5432"
    volumes:
      - icpc-lab-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U icpc -d icpc_lab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  icpc-lab-pgdata: